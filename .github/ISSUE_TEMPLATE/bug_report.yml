name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Never attach passwords, private text, or recordings of everything you typed.** Describe keys by name (for example "Right Command") instead.
  - type: input
    id: version
    attributes:
      label: Clavimo version or commit
      placeholder: 0.1.0 or a commit hash
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.3 (24D60), MacBook Pro M1 Pro
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Keyboard and mouse
      description: Model and connection (built-in, USB, Bluetooth, Logitech Bolt or Unifying receiver). `Clavimo --list-devices` prints connected devices.
    validations:
      required: true
  - type: input
    id: other-tools
    attributes:
      label: Other input tools running
      placeholder: Karabiner-Elements, Logi Options+, BetterTouchTool, none
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: Rule involved
      description: Paste the rule from config.json, with app names removed if they are private.
      render: json
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no passwords, private text or full key logs.
          required: true
