name: Feature request
description: Suggest a new rule type, action or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the workflow, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
  - type: textarea
    id: hardware
    attributes:
      label: Hardware involved
      description: Keyboards and mice the feature should work with, if relevant.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
